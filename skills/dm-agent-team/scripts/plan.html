<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan</title>
<link rel="icon" href="data:,">
<!--
  plan.html — the dm-agent-team plan monitor. scripts/monitor.sh copies it into
  <workspace>/logs/monitor/index.html and rewrites plan-data.js beside it, which
  calls window.__PLAN__({plan, env}). Self-contained: no external URLs, and it
  works from file:// as well as from monitor.sh's local server.
-->
<style>
:root {
  --canvas: #f4f6f5; --surface: #ffffff; --ink: #1d2a2e; --muted: #5f6e6c; --line: #d6dcda; --edge: #aab5b2;
  --crit: #2a5db0;
  --done-bg: #ddf1e2; --done-bd: #5aa26c;
  --prog-bg: #fdecc4; --prog-bd: #d29a2c;
  --review-bg: #ebe3f8; --review-bd: #8a6bc8;
  --ready-bg: #e3ecfb; --ready-bd: #4a77c4;
  --wait-bg: #eef1f0; --wait-bd: #b6bfbc;
  --bad-bg: #f8dddd; --bad-bd: #c24848;
  --stale-bg: #fbe8d8; --stale-bd: #cf7a2e;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --canvas: #151b1d; --surface: #1d2528; --ink: #e3ebe9; --muted: #95a3a0; --line: #334145; --edge: #5f6f6c;
    --crit: #7ea9f2;
    --done-bg: #1f3a29; --prog-bg: #45371a; --prog-bd: #e0a73a; --review-bg: #342a4b; --review-bd: #a68be0;
    --ready-bg: #1f2f4a; --ready-bd: #6f98e0; --wait-bg: #252e31; --wait-bd: #56635f;
    --bad-bg: #4a2424; --bad-bd: #e06a6a; --stale-bg: #46311f; --stale-bd: #e0914a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: grid; grid-template-rows: auto auto auto 1fr; background: var(--canvas); color: var(--ink); font: 13px/1.4 var(--sans); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--crit); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
.run small { display: block; color: var(--muted); font-size: 11px; }
.stats, .env { display: flex; gap: 18px; margin: 0; }
.stats div, .env div { display: flex; flex-direction: column-reverse; }
.stats dt, .env dt { color: var(--muted); font-size: 11px; }
.stats dd, .env dd { margin: 0; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.env dd { font-size: 13px; font-family: var(--mono); font-weight: 500; }
.env .warn dd { color: var(--bad-bd); }
#find { width: 190px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--canvas); }
.tools { display: flex; gap: 6px; }
.tools button { padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; }
.tools button:hover { border-color: var(--edge); }
.tools button[aria-pressed="true"] { background: var(--ready-bg); border-color: var(--crit); }

.legend { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 1px 10px; border: 1px solid; border-radius: 999px; cursor: pointer; font-size: 12px; }
.chip b { font-weight: 600; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink) inset; }
.chip.done { background: var(--done-bg); border-color: var(--done-bd); }
.chip.prog { background: var(--prog-bg); border-color: var(--prog-bd); }
.chip.review { background: var(--review-bg); border-color: var(--review-bd); }
.chip.ready { background: var(--ready-bg); border-color: var(--ready-bd); }
.chip.wait { background: var(--wait-bg); border-color: var(--wait-bd); }
.chip.bad { background: var(--bad-bg); border-color: var(--bad-bd); }
.chip.stale { background: var(--stale-bg); border-color: var(--stale-bd); border-style: dashed; }
.chip.critkey { background: none; border-color: var(--crit); color: var(--crit); }

#banner { padding: 8px 16px; background: var(--bad-bg); border-bottom: 1px solid var(--bad-bd); }
#banner ul { margin: 4px 0 0; padding-left: 18px; }
#banner details { margin-top: 4px; color: var(--muted); }

main { display: grid; grid-template-columns: 1fr minmax(320px, 400px); min-height: 0; }
#canvas { position: relative; overflow: hidden; min-height: 0; }
#svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#svg.panning { cursor: grabbing; }
#empty[hidden] { display: none; }
#empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; color: var(--muted); padding: 24px; }
#empty strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
#empty code { font-family: var(--mono); font-size: 12px; }

.edge { fill: none; stroke: var(--edge); stroke-width: 1.2; }
.edge.crit { stroke: var(--crit); stroke-width: 2.6; }
.node rect { stroke-width: 1.2; }
.node { cursor: pointer; }
.node .id { font: 600 12px var(--mono); fill: var(--ink); }
.node .tag { font: 500 10px var(--sans); fill: var(--muted); }
.node .risk { font: 600 10px var(--sans); fill: var(--bad-bd); }
.node .title { font: 12px var(--sans); fill: var(--ink); }
.node .val { font: 600 12px var(--sans); fill: var(--ink); font-variant-numeric: tabular-nums; }
.node .lbl { font: 10px var(--sans); fill: var(--muted); }
.node .line { font: 11px var(--sans); fill: var(--muted); }
.node.done rect { fill: var(--done-bg); stroke: var(--done-bd); }
.node.prog rect { fill: var(--prog-bg); stroke: var(--prog-bd); }
.node.review rect { fill: var(--review-bg); stroke: var(--review-bd); }
.node.ready rect { fill: var(--ready-bg); stroke: var(--ready-bd); }
.node.wait rect { fill: var(--wait-bg); stroke: var(--wait-bd); }
.node.bad rect { fill: var(--bad-bg); stroke: var(--bad-bd); }
.node.stale rect { fill: var(--stale-bg); stroke: var(--stale-bd); stroke-dasharray: 5 3; }
.node .critbar { fill: var(--crit); }
.node.sel rect.card { stroke: var(--ink); stroke-width: 2.6; }
.node:focus { outline: none; }
.node:focus-visible rect.card { stroke: var(--ink); stroke-width: 2.6; stroke-dasharray: 3 2; }
.dim { opacity: 0.22; }
@media (prefers-reduced-motion: no-preference) {
  .node.prog rect { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { stroke-opacity: 0.35; } }
}

aside { display: grid; grid-template-rows: minmax(0, 1.1fr) minmax(0, 1fr); border-left: 1px solid var(--line); background: var(--surface); min-height: 0; }
aside section { overflow: auto; padding: 12px 16px; min-height: 0; }
aside section + section { border-top: 1px solid var(--line); }
aside h2 { margin: 0 0 8px; font-size: 14px; font-weight: 650; }
#detail .hint { color: var(--muted); }
#detail .idline { font: 600 13px var(--mono); }
#detail .goal { margin: 4px 0 10px; font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(4, auto); justify-content: start; gap: 2px 18px; margin-bottom: 10px; }
.grid div { display: flex; flex-direction: column-reverse; }
.grid dt { color: var(--muted); font-size: 11px; }
.grid dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.facts { margin: 0 0 10px; display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.facts code, .mono { font-family: var(--mono); font-size: 12px; }
.link { border: 0; padding: 0; background: none; color: var(--crit); cursor: pointer; font: 12px var(--mono); text-decoration: underline; text-underline-offset: 2px; margin-right: 8px; }
h3 { margin: 12px 0 4px; font-size: 12px; font-weight: 650; color: var(--muted); }
ol.feed { list-style: none; margin: 0; padding: 0; }
ol.feed li { display: grid; grid-template-columns: 42px 82px 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
ol.feed li:first-child { border-top: 0; }
ol.feed time { color: var(--muted); font-variant-numeric: tabular-nums; }
ol.feed .who { font: 600 12px var(--mono); overflow-wrap: anywhere; }
ol.feed .what { overflow-wrap: anywhere; }
ol.feed .progress .what { color: var(--muted); }
.empty-note { color: var(--muted); }

@media (max-width: 900px) {
  html, body { height: auto; min-height: 100%; }
  main { grid-template-columns: 1fr; grid-template-rows: 65vh auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); grid-template-rows: auto auto; }
  aside section { overflow: visible; }
  #find { width: 140px; }
}
</style>
</head>
<body>
<header>
  <div class="run"><h1 id="run">Plan</h1><small id="stage">waiting for data</small></div>
  <dl class="stats" id="stats"></dl>
  <input type="search" id="find" placeholder="Find a phase" aria-label="Find a phase by ID, title, or file">
  <div class="tools">
    <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
    <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
    <button id="fit">Fit all</button>
    <button id="active">In progress</button>
    <button id="critbtn" aria-pressed="false">Critical path</button>
  </div>
  <dl class="env" id="env"></dl>
</header>
<div class="legend" id="legend" role="group" aria-label="Highlight phases by status"></div>
<div id="banner" hidden></div>
<main>
  <div id="canvas">
    <svg id="svg" aria-label="Build plan graph">
      <defs>
        <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--edge)"/></marker>
        <marker id="arrowc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--crit)"/></marker>
      </defs>
      <g id="vp"><g id="edges"></g><g id="nodes"></g></g>
    </svg>
    <div id="empty"><div><strong>Waiting for the plan</strong>Start <code>scripts/monitor.sh --workspace &lt;run folder&gt;</code>; this page reads the <code>plan-data.js</code> it writes.</div></div>
  </div>
  <aside>
    <section id="detail" aria-live="polite"><h2>Phase</h2><p class="hint">Select a phase to see its goal, status, files, and log.</p></section>
    <section><h2>Running log</h2><ol class="feed" id="log"></ol></section>
  </aside>
</main>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const W = 214, H = 58, HB = 112, GX = 34, GY = 54;
const CLS = { done: "done", "in-progress": "prog", "in-review": "review", pending: "wait", stale: "stale", blocked: "bad", escalated: "bad" };
const LEGEND = [["done", "done"], ["prog", "in progress"], ["review", "in review"], ["ready", "ready to start"], ["wait", "waiting"], ["stale", "stale"], ["bad", "blocked or escalated"]];
const S = { data: null, raw: "", lay: null, sel: null, view: { x: 40, y: 40, k: 1 }, fitted: false, status: null, crit: false, find: "", received: 0, loadError: false };
const $ = (id) => document.getElementById(id);

// ---- helpers --------------------------------------------------------------------
function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) { if (k === "on") e.addEventListener("click", attrs[k]); else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c instanceof Node ? c : String(c));
  return e;
}
function cut(s, n) { s = s || ""; return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function cls(n) { return (n.status === "pending" && n.ready) ? "ready" : (CLS[n.status] || "wait"); }
function live(n) { return n.status === "in-progress" || n.status === "in-review"; }
// §Log times are UTC (date -u): "2026-11-03T10:00Z", "2026-11-03 11:10".
function t(s) {
  if (!s) return NaN;
  let x = String(s).trim().replace(" ", "T");
  if (/^\d{4}-\d\d-\d\d$/.test(x)) x += "T00:00";
  if (!/(Z|[+-]\d\d:?\d\d)$/i.test(x)) x += "Z";
  return Date.parse(x);
}
function dur(ms) {
  if (!(ms >= 0)) return "–";
  const m = Math.floor(ms / 60000);
  if (m < 1) return Math.floor(ms / 1000) + "s";
  if (m < 60) return m + "m";
  const hr = Math.floor(m / 60);
  if (hr < 48) return hr + "h " + String(m % 60).padStart(2, "0") + "m";
  return Math.floor(hr / 24) + "d " + (hr % 24) + "h";
}
function ago(ms) { return isNaN(ms) ? "–" : dur(Date.now() - ms) + " ago"; }
function clock(ms) { return isNaN(ms) ? "" : new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false }); }
function lastUpdate(n) {
  const p = n.progress.lines.length ? t(n.progress.lines[n.progress.lines.length - 1].when) : NaN;
  const l = n.log.last ? t(n.log.last.when) : NaN;
  return isNaN(p) ? l : isNaN(l) ? p : Math.max(p, l);
}
function runtime(n) {
  const p0 = n.progress.lines.length ? t(n.progress.lines[0].when) : NaN;
  let start = t(n.log.first_when);
  if (isNaN(start) || p0 < start) start = isNaN(p0) ? start : p0;
  if (isNaN(start)) return NaN;
  return (live(n) ? Date.now() : lastUpdate(n)) - start;
}
function lastLine(n) {
  const p = n.progress.lines[n.progress.lines.length - 1];
  if (p && !(t(p.when) < t(n.log.last && n.log.last.when))) return p.text;
  return n.log.last ? [n.log.last.result, n.log.last.notes].filter(Boolean).join(": ") : "";
}

// ---- layout: layers from plan levels, barycentre ordering ------------------------
function layout(p) {
  const nodes = p.nodes, idx = new Map(nodes.map((n, i) => [n.id, i]));
  const preds = new Map(nodes.map((n) => [n.id, []])), succs = new Map(nodes.map((n) => [n.id, []]));
  for (const e of p.edges) if (preds.has(e.to) && succs.has(e.from)) { preds.get(e.to).push(e.from); succs.get(e.from).push(e.to); }
  let maxL = 0;
  for (const n of nodes) if (n.in_plan) maxL = Math.max(maxL, n.level);
  const layers = [];
  for (const n of nodes) {
    // A fix phase that only state.md knows, with no dependencies, sits below the plan.
    const l = (!n.in_plan && !preds.get(n.id).length) ? maxL + 1 : n.level;
    (layers[l] = layers[l] || []).push(n.id);
  }
  for (let i = 0; i < layers.length; i++) layers[i] = layers[i] || [];
  const pos = new Map();
  const place = (L) => L.forEach((id, i) => pos.set(id, i - (L.length - 1) / 2));
  layers.forEach(place);
  const bary = (id, nb) => { const a = nb.get(id).map((x) => pos.get(x)); return a.length ? a.reduce((s, v) => s + v, 0) / a.length : pos.get(id); };
  for (let it = 0; it < 8; it++) {
    const down = it % 2 === 0, nb = down ? preds : succs;
    const order = layers.map((_, i) => down ? i : layers.length - 1 - i);
    for (const li of order) { layers[li].sort((a, b) => (bary(a, nb) - bary(b, nb)) || (idx.get(a) - idx.get(b))); place(layers[li]); }
  }
  const byId = new Map(nodes.map((n) => [n.id, n]));
  const box = new Map();
  let y = 0, minX = Infinity, maxX = -Infinity;
  for (const L of layers) {
    const lh = L.some((id) => live(byId.get(id))) ? HB : H;
    for (const id of L) {
      const x = pos.get(id) * (W + GX);
      box.set(id, { x, y, w: W, h: live(byId.get(id)) ? HB : H });
      minX = Math.min(minX, x); maxX = Math.max(maxX, x + W);
    }
    if (L.length) y += lh + GY;
  }
  return { box, preds, succs, minX: isFinite(minX) ? minX : 0, maxX: isFinite(maxX) ? maxX : W, maxY: Math.max(y - GY, H) };
}

// ---- rendering --------------------------------------------------------------------
function focusSet() {
  const p = S.data.plan;
  if (S.sel && S.lay.box.has(S.sel)) return new Set([S.sel, ...S.lay.preds.get(S.sel), ...S.lay.succs.get(S.sel)]);
  const m = new Set();
  if (S.crit) p.critical_path.phases.forEach((id) => m.add(id));
  if (S.status) p.nodes.forEach((n) => { if (cls(n) === S.status) m.add(n.id); });
  if (S.find) p.nodes.forEach((n) => { if (matches(n, S.find)) m.add(n.id); });
  return (S.crit || S.status || S.find) ? m : null;
}
function matches(n, q) {
  q = q.toLowerCase();
  return [n.id, n.title, n.goal, n.slice, ...n.touches].some((s) => (s || "").toLowerCase().includes(q));
}
function drawGraph() {
  const p = S.data.plan, eg = $("edges"), ng = $("nodes");
  eg.replaceChildren(); ng.replaceChildren();
  const f = focusSet();
  for (const e of p.edges) {
    const a = S.lay.box.get(e.from), b = S.lay.box.get(e.to);
    if (!a || !b) continue;
    const x1 = a.x + W / 2, y1 = a.y + a.h, x2 = b.x + W / 2, y2 = b.y, dy = Math.max(24, (y2 - y1) / 2);
    const crit = e.critical && (S.crit || !f);
    const path = el("path", { d: `M${x1},${y1} C${x1},${y1 + dy} ${x2},${y2 - dy} ${x2},${y2 - 2}`, class: "edge" + (e.critical ? " crit" : ""), "marker-end": e.critical ? "url(#arrowc)" : "url(#arrow)" });
    const on = !f || (S.sel ? (e.from === S.sel || e.to === S.sel) : (f.has(e.from) && f.has(e.to)));
    if (!on) path.classList.add("dim");
    if (crit) eg.append(path); else eg.prepend(path);
  }
  for (const n of p.nodes) {
    const b = S.lay.box.get(n.id);
    const g = el("g", { class: `node ${cls(n)}${n.critical ? " crit" : ""}${S.sel === n.id ? " sel" : ""}${f && !f.has(n.id) ? " dim" : ""}`,
      transform: `translate(${b.x},${b.y})`, tabindex: "0", role: "button", "data-id": n.id,
      "aria-label": `${n.id} ${n.title}: ${n.status}${n.ready ? ", ready to start" : ""}` });
    g.append(el("title", {}, [n.id + " " + n.title, n.goal].filter(Boolean).join("\n")));
    g.append(el("rect", { class: "card", width: W, height: b.h, rx: 10, ry: 10 }));
    if (n.critical) g.append(el("rect", { class: "critbar", x: 3, y: 9, width: 4, height: b.h - 18, rx: 2 }));
    const id = el("text", { x: 12, y: 20, class: "id" }, n.id);
    const tags = [n.size, n.milestone].filter(Boolean).join("  ");
    if (tags) id.append(el("tspan", { dx: 7, class: "tag" }, tags));
    if (n.risk === "high") id.append(el("tspan", { dx: 7, class: "risk" }, "high risk"));
    if (n.fix) id.append(el("tspan", { dx: 7, class: "tag" }, "fix"));
    g.append(id);
    g.append(el("text", { x: 12, y: 40, class: "title" }, cut(n.title || n.goal, 31)));
    if (live(n)) {
      const cells = [[dur(runtime(n)), "runtime"], [String(n.revise_rounds), "retries"], [n.lane || "root", "lane"], [dur(Date.now() - lastUpdate(n)), "updated"]];
      const xs = [12, 74, 116, 166];
      cells.forEach(([v, l], i) => { g.append(el("text", { x: xs[i], y: 66, class: "val" }, cut(v, 7))); g.append(el("text", { x: xs[i], y: 79, class: "lbl" }, l)); });
      g.append(el("text", { x: 12, y: 100, class: "line" }, cut(lastLine(n), 36)));
    }
    ng.append(g);
  }
}
function applyView() { const v = S.view; $("vp").setAttribute("transform", `translate(${v.x},${v.y}) scale(${v.k})`); }
function fit(ids) {
  const r = $("svg").getBoundingClientRect();
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const id of ids) { const b = S.lay.box.get(id); if (!b) continue; x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); }
  if (!isFinite(x0) || r.width < 10) return;
  const k = Math.min((r.width - 60) / (x1 - x0), (r.height - 60) / (y1 - y0), 1.4);
  S.view = { k: Math.max(k, 0.08), x: r.width / 2 - (x0 + x1) / 2 * Math.max(k, 0.08), y: r.height / 2 - (y0 + y1) / 2 * Math.max(k, 0.08) };
  applyView();
}
function zoomAt(px, py, f) {
  const v = S.view, k = Math.min(3, Math.max(0.08, v.k * f));
  S.view = { k, x: px - (px - v.x) * k / v.k, y: py - (py - v.y) * k / v.k };
  applyView();
}

function stat(dl, label, value, warn) {
  dl.append(h("div", warn ? { class: "warn" } : {}, h("dt", {}, label), h("dd", {}, value)));
}
function drawHeader() {
  const d = S.data, p = d.plan, s = p.state || {}, env = d.env || {};
  document.title = (s.run || "Plan") + " — plan";
  $("run").textContent = s.run || "Plan";
  $("stage").textContent = [...new Set([s.stage, s.status])].concat([s.mode && s.mode + " mode", s.size]).filter(Boolean).join(", ");
  const by = {}; let retries = 0;
  for (const n of p.nodes) { by[cls(n)] = (by[cls(n)] || 0) + 1; retries += n.revise_rounds; }
  const st = $("stats"); st.replaceChildren();
  stat(st, "completed", `${by.done || 0} / ${p.nodes.length}`);
  stat(st, "in progress", (by.prog || 0) + (by.review || 0));
  stat(st, "ready", by.ready || 0);
  stat(st, "waiting", by.wait || 0);
  if (by.bad) stat(st, "blocked", by.bad, true);
  stat(st, "retries", retries);
  stat(st, "critical path left", p.remaining_path.phases.length ? `${p.remaining_path.phases.length} (weight ${p.remaining_path.weight})` : "none");
  const lg = $("legend"); lg.replaceChildren();
  for (const [c, label] of LEGEND) {
    if (!by[c] && (c === "stale" || c === "bad" || c === "review")) continue;
    const b = h("button", { class: "chip " + c, "aria-pressed": String(S.status === c), title: "Highlight " + label, on: () => { S.status = S.status === c ? null : c; S.sel = null; redraw(); } }, label, h("b", {}, by[c] || 0));
    lg.append(b);
  }
  lg.append(h("span", { class: "chip critkey" }, "critical path"));
  const bn = $("banner");
  if (!p.valid || p.warnings.length) {
    bn.replaceChildren();
    if (!p.valid) {
      bn.append(h("strong", {}, `The plan has ${p.errors.length} error${p.errors.length > 1 ? "s" : ""}; fix them in 03 §13.`), h("ul", {}, ...p.errors.slice(0, 3).map((e) => h("li", {}, e))));
      if (p.errors.length > 3) bn.append(h("details", {}, h("summary", {}, `${p.errors.length - 3} more`), h("ul", {}, ...p.errors.slice(3).map((e) => h("li", {}, e)))));
    }
    if (p.warnings.length) bn.append(h("details", {}, h("summary", {}, `${p.warnings.length} warning${p.warnings.length > 1 ? "s" : ""}`), h("ul", {}, ...p.warnings.map((w) => h("li", {}, w)))));
    bn.style.background = p.valid ? "var(--surface)" : "";
    bn.style.borderColor = p.valid ? "var(--line)" : "";
    bn.hidden = false;
  } else bn.hidden = true;
  drawEnv();
}
function drawEnv() {
  if (!S.data) return;
  const env = S.data.env || {}, dl = $("env"); dl.replaceChildren();
  const age = env.now ? Date.now() / 1000 - env.now : NaN;
  const stale = age > Math.max(15, 4 * (env.interval || 3));
  if (env.load) stat(dl, "load", env.load);
  if (env.head) stat(dl, env.branch || "HEAD", env.head + (env.dirty ? ` +${env.dirty}` : ""));
  if (env.upstream) stat(dl, "ahead / behind " + env.upstream, `${env.ahead} / ${env.behind}`);
  stat(dl, stale ? "monitor stopped?" : "updated", isNaN(age) ? "–" : dur(age * 1000) + " ago", stale);
}

function drawDetail() {
  const box = $("detail"); box.replaceChildren(h("h2", {}, "Phase"));
  const n = S.sel && S.data.plan.nodes.find((x) => x.id === S.sel);
  if (!n) { box.append(h("p", { class: "hint" }, "Select a phase to see its goal, status, files, and log.")); return; }
  const link = (id) => h("button", { class: "link", on: () => select(id, true) }, id);
  box.append(h("div", { class: "idline" }, n.id + (n.critical ? ", on the critical path" : "")));
  box.append(h("p", { class: "goal" }, n.title + (n.goal && n.goal !== n.title ? ": " + n.goal : "")));
  const g = h("dl", { class: "grid" });
  stat(g, "state", n.status + (n.ready ? ", ready" : ""));
  stat(g, "runtime", dur(runtime(n)));
  stat(g, "retries", n.revise_rounds);
  stat(g, "last update", ago(lastUpdate(n)));
  box.append(g);
  const facts = h("dl", { class: "facts" });
  const fact = (k, v) => { if (v == null || v === "" || (Array.isArray(v) && !v.length)) return; facts.append(h("dt", {}, k), h("dd", {}, ...(Array.isArray(v) ? v : [v]))); };
  fact("milestone", n.milestone);
  fact("size", n.size || "unsized");
  fact("risk", n.risk || "normal");
  fact("slice", n.slice || n.layer);
  fact("lane", n.lane ? h("span", { class: "mono" }, n.lane) : "");
  fact("base", n.base ? h("span", { class: "mono" }, n.base) : "");
  fact("depends on", n.depends_on.map(link));
  fact("needed by", S.lay.succs.get(n.id).map(link));
  fact("touches", n.touches.map((x, i) => h("code", {}, (i ? ", " : "") + x)));
  fact("acceptance", n.acceptance);
  fact("traces", n.traces);
  fact("notes", n.notes);
  box.append(facts);
  const rows = feedFor((r) => r.phases.includes(n.id));
  box.append(h("h3", {}, "Activity"), rows.length ? feedList(rows) : h("p", { class: "empty-note" }, "No log rows or progress lines for this phase yet."));
}
function feedFor(keep) {
  const out = [];
  for (const r of S.data.plan.log) {
    if (!keep(r)) continue;
    // "builder · PHASE-009 (resume)" → "builder (resume)": the phase is already in the who column.
    const agent = r.phases.reduce((a, id) => a.split(id).join(""), r.agent).replace(/[\s·]+/g, " ").trim();
    out.push({ at: t(r.when), who: r.phases[0] || r.stage, what: [agent, r.result, r.notes].filter(Boolean).join(": "), kind: "log" });
  }
  for (const n of S.data.plan.nodes) for (const l of n.progress.lines) if (keep({ phases: [n.id] })) out.push({ at: t(l.when), who: n.id, what: l.text, kind: "progress" });
  return out.sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 80);
}
function feedList(rows) {
  return h("ol", { class: "feed" }, ...rows.map((r) => h("li", { class: r.kind }, h("time", { title: isNaN(r.at) ? "" : new Date(r.at).toISOString() }, clock(r.at)), h("span", { class: "who" }, r.who), h("span", { class: "what" }, r.what))));
}
function drawLog() {
  const rows = feedFor(() => true), ol = $("log");
  ol.replaceWith(rows.length ? Object.assign(feedList(rows), { id: "log" }) : h("p", { id: "log", class: "empty-note" }, "Nothing logged yet. Rows appear as agents return and builders report progress."));
}

function redraw() { drawGraph(); drawHeader(); drawDetail(); }
function render() {
  const p = S.data.plan;
  $("empty").hidden = p.nodes.length > 0;
  if (!p.nodes.length) { $("empty").querySelector("strong").textContent = "The plan has no phases yet"; }
  S.lay = layout(p);
  if (S.sel && !S.lay.box.has(S.sel)) S.sel = null;
  redraw(); drawLog();
  if (!S.fitted && p.nodes.length) { S.fitted = true; firstView(); }
}
// Fit the whole plan when it stays readable; otherwise open at a readable zoom on the
// work in flight, then the ready phases, then the top of the plan.
function firstView() {
  const ns = S.data.plan.nodes;
  fit(ns.map((n) => n.id));
  if (S.view.k >= 0.55) return;
  const act = ns.filter(live), rd = ns.filter((n) => n.ready), r = $("svg").getBoundingClientRect();
  const focus = act.length ? act : rd;
  if (focus.length) { fit(focus.map((n) => n.id)); if (S.view.k <= 1) return; zoomAt(r.width / 2, r.height / 2, 0.9 / S.view.k); return; }
  const k = 0.9, top = Math.min(...[...S.lay.box.values()].map((b) => b.y));
  S.view = { k, x: r.width / 2 - (S.lay.minX + S.lay.maxX) / 2 * k, y: 30 - top * k };
  applyView();
}
function select(id, center) {
  S.sel = S.sel === id && !center ? null : id;
  redraw();
  if (center && S.sel) {
    const b = S.lay.box.get(id), r = $("svg").getBoundingClientRect();
    S.view.x = r.width / 2 - (b.x + W / 2) * S.view.k; S.view.y = r.height / 2 - (b.y + b.h / 2) * S.view.k; applyView();
  }
}

// ---- interaction ----------------------------------------------------------------------
const svg = $("svg");
let drag = null;
svg.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, vx: S.view.x, vy: S.view.y, moved: false }; svg.setPointerCapture(e.pointerId); });
svg.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) { drag.moved = true; svg.classList.add("panning"); }
  if (drag.moved) { S.view.x = drag.vx + dx; S.view.y = drag.vy + dy; applyView(); }
});
svg.addEventListener("pointerup", (e) => {
  const d = drag; drag = null; svg.classList.remove("panning");
  if (!d || d.moved || !S.data) return;
  const hit = document.elementsFromPoint(e.clientX, e.clientY).map((x) => x.closest && x.closest(".node")).find(Boolean);
  if (hit) select(hit.dataset.id); else if (S.sel) { S.sel = null; redraw(); }
});
svg.addEventListener("wheel", (e) => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
svg.addEventListener("keydown", (e) => { const g = e.target.closest && e.target.closest(".node"); if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(g.dataset.id); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.data) { S.sel = null; S.status = null; redraw(); } });
const mid = () => { const r = svg.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
$("zin").onclick = () => zoomAt(...mid(), 1.25);
$("zout").onclick = () => zoomAt(...mid(), 0.8);
$("fit").onclick = () => S.data && fit(S.data.plan.nodes.map((n) => n.id));
$("active").onclick = () => {
  if (!S.data) return;
  const ns = S.data.plan.nodes, act = ns.filter(live), rd = ns.filter((n) => n.ready);
  fit((act.length ? act : rd.length ? rd : ns).map((n) => n.id));
};
$("critbtn").onclick = () => { S.crit = !S.crit; $("critbtn").setAttribute("aria-pressed", String(S.crit)); S.sel = null; if (S.data) redraw(); };
$("find").addEventListener("input", (e) => { S.find = e.target.value.trim(); S.sel = null; if (S.data) redraw(); });
$("find").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !S.data || !S.find) return;
  const n = S.data.plan.nodes.find((x) => matches(x, S.find));
  if (n) select(n.id, true);
});

// ---- data: plan-data.js calls __PLAN__ -------------------------------------------------
window.__PLAN__ = function (d) {
  S.loadError = false; S.received = Date.now();
  const raw = JSON.stringify(d.plan);
  const first = !S.data;
  S.data = d;
  if (raw !== S.raw || first) { S.raw = raw; render(); } else drawEnv();
};
let lastFull = 0;
function poll() {
  const s = document.createElement("script");
  s.src = "plan-data.js?" + Date.now();
  s.onload = () => s.remove();
  s.onerror = () => {
    s.remove();
    if (!S.data) { const e = $("empty"); e.hidden = false; e.querySelector("strong").textContent = "No plan-data.js next to this page"; }
  };
  document.head.append(s);
  const every = ((S.data && S.data.env && S.data.env.interval) || 3) * 1000;
  setTimeout(poll, every);
}
// Runtimes and ages move without new data: refresh them every 15 s.
setInterval(() => { if (S.data) { drawEnv(); if (Date.now() - lastFull > 15000) { lastFull = Date.now(); drawGraph(); drawDetail(); } } }, 1000);
poll();
</script>
</body>
